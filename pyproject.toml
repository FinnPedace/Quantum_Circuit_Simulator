[project]
name = "quantum-circuit-simulator"
version = "0.1.0"
description = "A Python library for simulating Qiskit quantum circuits and retrieving measurement results and optional final statevectors."
readme = "README.md"
authors = [
    { name = "Finn Pedace", email = "finnpedace@outlook.de" }

]
requires-python = ">=3.13"
dependencies = [
    "qiskit>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
